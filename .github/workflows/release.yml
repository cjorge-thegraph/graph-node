name: Release Please

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # rehearsal only: GITHUB_TOKEN instead of the App
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summarise
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
        run: |
          if [ "$RELEASE_CREATED" = "true" ]; then
            echo "Released $TAG_NAME" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PRS_CREATED" = "true" ]; then
            echo "Release PR created/updated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to release" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # A called workflow gets at most its caller's permissions; id-token and
    # attestations are for the build provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  docker:
    name: Docker images
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
